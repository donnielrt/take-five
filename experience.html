<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>FIVE — play it live</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="cv"></canvas>

      <div class="chrome">
        <header class="title-block">
          <a class="back" href="./">&larr; the journey</a>
          <h1>TAKE&nbsp;FIVE</h1>
          <p class="sub">
            a five-fold interpretation &middot; 5/4 &middot; in the spirit of
            Brubeck &amp; Desmond
          </p>
        </header>

        <div id="act" class="act">Count In</div>

        <div id="count" class="count">5</div>

        <div class="controls">
          <button id="play" aria-label="Play">
            &#9654;&nbsp; Play the piece
          </button>
          <p class="hint">
            space&nbsp;=&nbsp;play/pause &middot; an original real-time
            interpretation
          </p>
        </div>

        <footer class="credit">
          an original real-time interpretation &mdash; not a reproduction of the
          recording
        </footer>
      </div>
    </div>

    <script src="js/score.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/render2d.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
